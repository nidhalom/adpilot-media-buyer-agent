name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: |
          adpilot sample --out-dir /tmp/sample
          adpilot analyze /tmp/sample/sample.csv --margin 0.35 --offline --out /tmp/report.md
