<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AdPilot — Your AI media buyer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b02"/>
      <stop offset="1" stop-color="#3a1604"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 4s ease-in-out infinite}
    .b2{animation-delay:.25s}.b3{animation-delay:.5s}.b4{animation-delay:.75s}.b5{animation-delay:1s}
    @keyframes grow{0%{transform:scaleY(.15)}40%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
    .line{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 4s ease-in-out infinite}
    @keyframes draw{0%,10%{stroke-dashoffset:520}50%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:520}}
    .rocket{animation:fly 4s ease-in-out infinite}
    @keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-18px)}}
    .flame{transform-box:fill-box;transform-origin:top;animation:fl .25s ease-in-out infinite alternate}
    @keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}
    .kpi{animation:pop 4s ease-in-out infinite}
    .k2{animation-delay:.6s}.k3{animation-delay:1.2s}
    @keyframes pop{0%,100%{opacity:.35}25%,60%{opacity:1}}
    text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
  </style>
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- chart -->
  <g transform="translate(90 70)">
    <line x1="0" y1="260" x2="330" y2="260" stroke="#fdba74" stroke-opacity=".4" stroke-width="2"/>
    <g fill="#fb923c" fill-opacity=".85">
      <rect class="bar" x="15" y="200" width="40" height="60" rx="6"/>
      <rect class="bar b2" x="80" y="170" width="40" height="90" rx="6"/>
      <rect class="bar b3" x="145" y="140" width="40" height="120" rx="6"/>
      <rect class="bar b4" x="210" y="100" width="40" height="160" rx="6"/>
      <rect class="bar b5" x="275" y="60" width="40" height="200" rx="6"/>
    </g>
    <polyline class="line" points="35,185 100,150 165,125 230,80 295,35" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- rocket -->
    <g transform="translate(300 -10) rotate(40)"><g class="rocket">
      <path class="flame" d="M-8 46 L0 80 L8 46 Z" fill="url(#flame)"/>
      <path d="M0 -40 C18 -20 18 20 12 46 H-12 C-18 20 -18 -20 0 -40 Z" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="8" fill="#fb923c"/>
      <path d="M-12 30 L-26 50 L-12 46 Z M12 30 L26 50 L12 46 Z" fill="#f97316"/>
    </g></g>
  </g>

  <text x="500" y="175" font-size="108" font-weight="800" fill="url(#title)" filter="url(#glow)">AdPilot</text>
  <text x="504" y="230" font-size="36" fill="#fed7aa">Your AI media buyer.</text>
  <g font-size="19" font-weight="600" transform="translate(504 270)">
    <g class="kpi"><rect width="170" height="40" rx="20" fill="#7c2d12"/><text x="85" y="26" text-anchor="middle" fill="#ffedd5">✂ kill losers</text></g>
    <g class="kpi k2" transform="translate(190 0)"><rect width="190" height="40" rx="20" fill="#7c2d12"/><text x="95" y="26" text-anchor="middle" fill="#ffedd5">📈 scale winners</text></g>
    <g class="kpi k3" transform="translate(400 0)"><rect width="200" height="40" rx="20" fill="#7c2d12"/><text x="100" y="26" text-anchor="middle" fill="#ffedd5">✨ fresh hooks</text></g>
  </g>
</svg>
